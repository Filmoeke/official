<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Media Uploader</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .upload-box { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; border-radius: 8px; background: #f8fafc; }
        input[type="file"] { margin: 15px 0; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #progressBar { width: 100%; background: #e2e8f0; height: 10px; border-radius: 5px; margin-top: 15px; overflow: hidden; display: none; }
        #progressFill { width: 0%; height: 100%; background: #22c55e; transition: width 0.2s; }
        #status { margin-top: 10px; font-size: 14px; color: #475569; }
    </style>
</head>
<body>

    <div class="upload-box">
        <h2>Upload Media</h2>
        <p>Select photos or videos (Original Quality)</p>
        <input type="file" id="mediaFile" accept="image/*,video/*">
        <br>
        <button id="uploadBtn" onclick="startUpload()">Upload Now</button>
        
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <p id="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
