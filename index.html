<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film O Eke | Photography & Videography</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b0c10; color: #c5c6c7; line-height: 1.6; overflow-x: hidden; }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(102, 252, 241, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(69, 162, 158, 0.05), transparent 50%);
            z-index: -1; pointer-events: none;
        }

        header { text-align: center; padding: 35px 15px 20px; background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%); border-bottom: 1px solid rgba(102, 252, 241, 0.1); }
        header h1 {
            font-size: 2.2rem; letter-spacing: 2px; display: inline-block;
            background: linear-gradient(90deg, #66fcf1, #45a29e, #ffffff, #66fcf1);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: cinemaShine 5s linear infinite; text-transform: uppercase;
        }
        @keyframes cinemaShine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        header p { color: #c5c6c7; font-size: 0.95rem; margin-top: 6px; font-weight: 300; }

        nav { 
            background: rgba(31, 40, 51, 0.95); backdrop-filter: blur(10px); padding: 12px 15px; 
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .social-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .social-links a { color: #66fcf1; text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 5px 10px; border-radius: 20px; background: rgba(102, 252, 241, 0.05); border: 1px solid rgba(102, 252, 241, 0.2); transition: all 0.3s; }
        .social-links a:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 10px rgba(102, 252, 241, 0.4); }

        .nav-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-action { background: linear-gradient(135deg, #ff6600, #ff8533); color: #fff; font-weight: bold; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; }
        .btn-google { background: #ea4335; color: #fff; font-weight: bold; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; }
        .btn-admin { background: transparent; color: #66fcf1; border: 1px solid #45a29e; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

        .user-profile { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(102,252,241,0.2); }
        .user-profile img { width: 24px; height: 24px; border-radius: 50%; }
        .user-profile span { font-size: 0.8rem; color: #fff; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .section-title { color: #ffffff; font-size: 1.4rem; margin-bottom: 20px; border-left: 4px solid #ff6600; padding-left: 10px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }

        .media-card { background: #1f2833; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .media-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); }
        .media-card img, .media-card video { width: 100%; height: 220px; object-fit: cover; display: block; }
        
        .media-info { padding: 12px 15px; flex-grow: 1; }
        .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .media-info h4 { color: #ffffff; font-size: 1rem; }
        .btn-edit-title { background: none; border: none; color: #45a29e; cursor: pointer; font-size: 0.75rem; }
        .media-info p { font-size: 0.8rem; color: #66fcf1; }

        .btn-delete-card { position: absolute; top: 12px; right: 12px; background: rgba(220, 53, 69, 0.8); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 0.85rem; z-index: 5; }

        .vote-actions { display: flex; gap: 8px; padding: 10px 15px; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(11, 12, 16, 0.4); }
        .btn-vote { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(102, 252, 241, 0.2); color: #c5c6c7; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 4px; }
        
        .comments-section { border-top: 1px solid rgba(255, 255, 255, 0.05); background: #161c23; padding: 12px 15px; }
        .comments-list { overflow-y: auto; max-height: 110px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .comment-item { background: #0b0c10; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; }
        .comment-text strong { color: #66fcf1; margin-right: 4px; }
        .btn-delete-comment { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 0.75rem; }

        .comment-form { display: flex; gap: 4px; }
        .comment-form input { flex: 1; padding: 6px 10px; font-size: 0.8rem; background: #0b0c10; border: 1px solid #45a29e; border-radius: 4px; color: #fff; }
        .comment-form button { background: #45a29e; color: #0b0c10; font-weight: bold; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000; padding: 15px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #1f2833; width: 100%; max-width: 480px; border-radius: 12px; padding: 25px; border: 1px solid rgba(102, 252, 241, 0.3); position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 12px; right: 15px; font-size: 1.5rem; background: none; border: none; color: #c5c6c7; cursor: pointer; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #ffffff; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border-radius: 6px; background: #0b0c10; border: 1px solid #45a29e; color: #ffffff; outline: none; }

        .admin-item { display: flex; gap: 12px; align-items: center; background: #0b0c10; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .admin-preview { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; }
        .admin-actions { display: flex; gap: 6px; margin-left: auto; }
        .btn-approve { background: #28a745; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        footer { text-align: center; padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 40px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>
        <h1>Film O Eke</h1>
        <p>A Visual Journey in Photography & Videography</p>
    </header>

    <nav>
        <div class="social-links">
            <a href="https://instagram.com/Filmoeke" target="_blank">📷 @Film_O_Eke</a>
            <a href="https://instagram.com/Imxsajid" target="_blank">👤 Instagram</a>
            <a href="https://facebook.com/isajid19" target="_blank">🌐 Facebook</a>
        </div>
        <div class="nav-buttons">
            <div id="authContainer">
                <button class="btn-google" id="btnGoogleLogin">Sign in with Google</button>
            </div>
            <button class="btn-action" onclick="openUploadModal()">Submit Post</button>
            <button class="btn-admin" onclick="triggerAdminPanel()">Owner Portal</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">Approved Showcase Gallery</h2>
        <div class="gallery-grid" id="publicGallery">
            <p style="color: #aaa;">Loading gallery...</p>
        </div>
    </div>

    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal('uploadModal')">&times;</button>
            <h3 style="color: #66fcf1; margin-bottom: 8px;">Submit Media</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Title / Caption *</label>
                    <input type="text" id="mediaTitle" placeholder="e.g., Sunset over the hills" required>
                </div>
                <div class="form-group">
                    <label>Media Type *</label>
                    <select id="mediaType">
                        <option value="image">Photo</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Choose File *</label>
                    <input type="file" id="mediaFile" accept="image/*,video/*" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-action" style="width: 100%;">Upload & Send for Approval</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card" style="max-width: 380px;">
            <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            <h3 style="color: #66fcf1; margin-bottom: 6px; text-align: center;">Owner Portal Login</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="loginUserId" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <p id="loginError" style="color: #dc3545; font-size: 0.8rem; display: none; margin-bottom: 10px; text-align: center;">Invalid Credentials!</p>
                <button type="submit" class="btn-action" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-card" style="max-width: 620px;">
            <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
            <h3 style="color: #66fcf1; margin-bottom: 16px;">Owner Control Panel</h3>
            <div id="pendingQueue" style="max-height: 380px; overflow-y: auto;">
                <p style="color: #aaa;">Loading queue...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Film O Eke | Photography & Videography</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const CLOUDINARY_CLOUD_NAME = "pbyypohy";
        const CLOUDINARY_UPLOAD_PRESET = "filmoeke_preset";

        const firebaseConfig = {
            apiKey: "AIzaSyA1ILve-4DPE-SxMgVwcPBrRXpIp_5gNzE",
            authDomain: "filmoeke.firebaseapp.com",
            projectId: "filmoeke",
            storageBucket: "filmoeke.firebasestorage.app",
            messagingSenderId: "477216243691",
            appId: "1:477216243691:web:5d2eed16adeaada643a3ae",
            measurementId: "G-NDEM9KCV5S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Auth state watcher
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('authContainer');
            if (user) {
                authContainer.innerHTML = `
                    <div class="user-profile">
                        <img src="${user.photoURL || 'https://via.placeholder.com/24'}" alt="User">
                        <span>${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
                        <button id="btnLogoutGoogle" style="background:none;border:none;color:#dc3545;cursor:pointer;font-weight:bold;margin-left:5px;">✕</button>
                    </div>
                `;
                document.getElementById('btnLogoutGoogle').addEventListener('click', () => signOut(auth));
            } else {
                authContainer.innerHTML = `<button class="btn-google" id="btnGoogleLogin">Sign in with Google</button>`;
                document.getElementById('btnGoogleLogin').addEventListener('click', handleGoogleLogin);
            }
            loadGallery();
        });

        async function handleGoogleLogin() {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error("Google Login Error:", err);
                alert("Sign In Error: " + err.message);
            }
        }

        window.openUploadModal = function() {
            if (!currentUser) return alert("Please sign in with Google to post!");
            openModal('uploadModal');
        };

        // Post upload handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("Please sign in first.");

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const title = document.getElementById('mediaTitle').value.trim();
            const type = document.getElementById('mediaType').value;
            const fileInput = document.getElementById('mediaFile');
            const file = fileInput.files[0];

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const resourceType = type === 'video' ? 'video' : 'image';
            const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', endpoint, true);
            xhr.onload = async () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    await addDoc(collection(db, "posts"), {
                        uploaderUid: currentUser.uid,
                        uploaderName: currentUser.displayName || "Anonymous",
                        title: title,
                        type: type,
                        url: response.secure_url,
                        approved: false,
                        likes: 0,
                        dislikes: 0,
                        comments: [],
                        createdAt: new Date()
                    });
                    alert("Post submitted for approval!");
                    document.getElementById('uploadForm').reset();
                    closeModal('uploadModal');
                } else {
                    alert("Media upload failed.");
                }
                btn.disabled = false;
            };
            xhr.send(formData);
        });

        // Load Gallery
        async function loadGallery() {
            const container = document.getElementById('publicGallery');
            try {
                const q = query(collection(db, "posts"), where("approved", "==", true));
                const querySnapshot = await getDocs(q);
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #aaa;">No approved posts available.</p>`;
                    return;
                }

                const postsList = [];
                querySnapshot.forEach((docSnap) => {
                    postsList.push({ id: docSnap.id, ...docSnap.data() });
                });

                postsList.sort((a, b) => (b.likes || 0) - (a.likes || 0));

                postsList.forEach((data) => {
                    const isOwner = window.isOwnerLoggedIn;
                    const isAuthor = currentUser && currentUser.uid === data.uploaderUid;
                    const canDeletePost = isOwner || isAuthor;

                    let commentsHTML = "";
                    (data.comments || []).forEach((c) => {
                        const canDeleteComment = isOwner || (currentUser && currentUser.uid === c.uid);
                        const commentJson = encodeURIComponent(JSON.stringify(c));
                        commentsHTML += `
                            <div class="comment-item">
                                <div class="comment-text">
                                    <strong>${c.name}:</strong> <span>${c.text}</span>
                                </div>
                                ${canDeleteComment ? `<button class="btn-delete-comment" onclick="deleteComment('${data.id}', '${commentJson}')">✕</button>` : ''}
                            </div>
                        `;
                    });

                    container.innerHTML += `
                        <div class="media-card">
                            ${canDeletePost ? `<button class="btn-delete-card" onclick="deletePost('${data.id}')">✕</button>` : ''}
                            ${data.type === 'image' 
                                ? `<img src="${data.url}" alt="${data.title}" loading="lazy">` 
                                : `<video src="${data.url}" controls></video>`}
                            <div class="media-info">
                                <div class="title-row">
                                    <h4>${data.title}</h4>
                                    ${isAuthor ? `<button class="btn-edit-title" onclick="editTitle('${data.id}', '${data.title}')">✏️ Edit</button>` : ''}
                                </div>
                                <p>By ${data.uploaderName}</p>
                            </div>
                            <div class="vote-actions">
                                <button class="btn-vote" onclick="votePost('${data.id}', 'likes')">👍 ${data.likes || 0}</button>
                                <button class="btn-vote" onclick="votePost('${data.id}', 'dislikes')">👎 ${data.dislikes || 0}</button>
                            </div>
                            <div class="comments-section">
                                <div class="comments-list">${commentsHTML || '<p style="font-size: 0.75rem; color: #666;">No comments yet.</p>'}</div>
                                <form class="comment-form" onsubmit="addComment(event, '${data.id}')">
                                    <input type="text" placeholder="${currentUser ? 'Write a comment...' : 'Sign in to comment'}" ${!currentUser ? 'disabled' : ''} required>
                                    <button type="submit" ${!currentUser ? 'disabled' : ''}>Post</button>
                                </form>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p style="color:#dc3545;">Error loading gallery: ${err.message}</p>`;
            }
        }

        window.deletePost = async function(id) {
            if (confirm("Delete this post permanently?")) {
                await deleteDoc(doc(db, "posts", id));
                loadGallery();
            }
        };

        window.editTitle = async function(id, oldTitle) {
            const newTitle = prompt("Enter new caption:", oldTitle);
            if (newTitle && newTitle.trim()) {
                await updateDoc(doc(db, "posts", id), { title: newTitle.trim() });
                loadGallery();
            }
        };

        window.addComment = async function(e, postId) {
            e.preventDefault();
            if (!currentUser) return alert("Sign in to comment.");
            const input = e.target.querySelector('input');
            const commentObj = {
                uid: currentUser.uid,
                name: currentUser.displayName || "User",
                text: input.value.trim(),
                id: Date.now().toString()
            };
            await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(commentObj) });
            loadGallery();
        };

        window.deleteComment = async function(postId, encodedComment) {
            const commentObj = JSON.parse(decodeURIComponent(encodedComment));
            if (confirm("Delete this comment?")) {
                await updateDoc(doc(db, "posts", postId), { comments: arrayRemove(commentObj) });
                loadGallery();
            }
        };

        window.votePost = async function(id, type) {
            await updateDoc(doc(db, "posts", id), { [type]: increment(1) });
            loadGallery();
        };

        window.loadPendingQueue = async function() {
            const container = document.getElementById('pendingQueue');
            const q = query(collection(db, "posts"), where("approved", "==", false));
            const querySnapshot = await getDocs(q);
            container.innerHTML = querySnapshot.empty ? "<p style='color:#aaa;'>No pending submissions.</p>" : "";

            querySnapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                const id = documentSnap.id;
                container.innerHTML += `
                    <div class="admin-item">
                        <img src="${data.url}" class="admin-preview">
                        <div>
                            <strong style="color:#fff;">${data.title}</strong>
                            <p style="font-size:0.8rem;color:#66fcf1;">By: ${data.uploaderName}</p>
                        </div>
                        <div class="admin-actions">
                            <button class="btn-approve" onclick="approvePost('${id}')">Approve</button>
                            <button class="btn-reject" onclick="rejectPost('${id}')">Reject</button>
                        </div>
                    </div>
                `;
            });
        };

        window.approvePost = async function(id) {
            await updateDoc(doc(db, "posts", id), { approved: true });
            window.loadPendingQueue();
            loadGallery();
        };

        window.rejectPost = async function(id) {
            await deleteDoc(doc(db, "posts", id));
            window.loadPendingQueue();
        };

        loadGallery();
    </script>

    <script>
        const AUTH_USER_ID = "0000332211";
        const AUTH_PASS = "0091";
        window.isOwnerLoggedIn = false;

        function triggerAdminPanel() {
            if (window.isOwnerLoggedIn) {
                openModal('adminModal');
                if (window.loadPendingQueue) window.loadPendingQueue();
            } else {
                openModal('loginModal');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const uId = document.getElementById('loginUserId').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            if (uId === AUTH_USER_ID && pass === AUTH_PASS) {
                window.isOwnerLoggedIn = true;
                closeModal('loginModal');
                openModal('adminModal');
                if (window.loadPendingQueue) window.loadPendingQueue();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
