<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLOUDINARY_CLOUD_NAME = "pbyypohy";
    const CLOUDINARY_UPLOAD_PRESET = "filmoeke_preset";

    const firebaseConfig = {
        apiKey: "AIzaSyA1ILve-4DPE-SxMgVwcPBrRXpIp_5gNzE",
        authDomain: "filmoeke.firebaseapp.com",
        projectId: "filmoeke",
        storageBucket: "filmoeke.firebasestorage.app",
        messagingSenderId: "477216243691",
        appId: "1:477216243691:web:5d2eed16adeaada643a3ae",
        measurementId: "G-NDEM9KCV5S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    window.isOwnerLoggedIn = localStorage.getItem('filmoeke_owner') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('filmoeke_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
        }
        updateUIState();
    });

    function updateUIState() {
        const profileLoggedOut = document.getElementById('profileLoggedOut');
        const profileLoggedIn = document.getElementById('profileLoggedIn');
        const navAvatar = document.getElementById('navAvatar');
        const navProfileLabel = document.getElementById('navProfileLabel');
        const btnAdminDashboard = document.getElementById('btnAdminDashboard');

        if (currentUser || window.isOwnerLoggedIn) {
            profileLoggedOut.style.display = 'none';
            profileLoggedIn.style.display = 'block';

            if (currentUser) {
                document.getElementById('userDisplayName').innerText = currentUser.name;
                document.getElementById('userInstaId').innerText = currentUser.insta;
                navProfileLabel.innerText = currentUser.name.split(' ')[0];
                navAvatar.innerText = currentUser.name.charAt(0).toUpperCase();
                loadUserPostStatuses();
            } else {
                document.getElementById('userDisplayName').innerText = "Owner Admin";
                document.getElementById('userInstaId').innerText = "@admin_portal";
                navProfileLabel.innerText = "Owner";
                navAvatar.innerText = "A";
                document.getElementById('myPostsStatusList').innerHTML = `<span style="font-size: 0.72rem; color: var(--text-muted);">Logged in as Admin</span>`;
            }

            if (window.isOwnerLoggedIn) {
                btnAdminDashboard.style.display = 'flex';
            } else {
                btnAdminDashboard.style.display = 'none';
            }
        } else {
            profileLoggedOut.style.display = 'block';
            profileLoggedIn.style.display = 'none';
            navProfileLabel.innerText = 'Profile';
            navAvatar.innerText = '?';
            btnAdminDashboard.style.display = 'none';
        }
        loadGallery();
    }

    document.getElementById('userLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('loginName').value.trim();
        const insta = document.getElementById('loginInsta').value.trim();

        currentUser = { name, insta: insta.startsWith('@') ? insta : '@' + insta };
        localStorage.setItem('filmoeke_user', JSON.stringify(currentUser));
        
        closeModal('loginModal');
        document.getElementById('userLoginForm').reset();
        updateUIState();
    });

    document.getElementById('btnLogout').onclick = () => {
        currentUser = null;
        localStorage.removeItem('filmoeke_user');
        localStorage.removeItem('filmoeke_owner');
        window.isOwnerLoggedIn = false;
        updateUIState();
        document.getElementById('profileDropdown').classList.remove('active');
    };

    window.openUploadModal = function() {
        if (!currentUser) {
            alert("Please log in with your Name and Instagram ID to submit content!");
            openModal('loginModal');
            return;
        }
        document.getElementById('uploadProgressContainer').style.display = 'none';
        document.getElementById('progressBarFill').style.width = '0%';
        openModal('uploadModal');
    };

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("Please log in first.");

        const btn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('uploadProgressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercentText = document.getElementById('progressPercentText');

        const title = document.getElementById('mediaTitle').value.trim();
        const type = document.getElementById('mediaType').value;
        const fileInput = document.getElementById('mediaFile');
        let file = fileInput.files[0];

        const maxSize = type === 'video' ? 100 * 1024 * 1024 : 10 * 1024 * 1024;
        if (file.size > maxSize) {
            alert(`File is too large. Max size allowed is ${type === 'video' ? '100MB' : '10MB'}.`);
            return;
        }

        btn.disabled = true;
        progressContainer.style.display = 'block';
        progressPercentText.innerText = "Processing file...";

        // Compress image if applicable
        if (type === 'image' && file.size > 400 * 1024) {
            file = await compressImage(file);
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        // Optimization tag parameter to speed up Cloudinary backend processing
        formData.append('folder', 'filmoeke_uploads');

        const resourceType = type === 'video' ? 'video' : 'image';
        const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;

        const xhr = new XMLHttpRequest();
        xhr.open('POST', endpoint, true);

        xhr.upload.onprogress = function(event) {
            if (event.lengthComputable) {
                const percentComplete = Math.round((event.loaded / event.total) * 100);
                progressBarFill.style.width = percentComplete + '%';
                progressPercentText.innerText = percentComplete + '%';
            }
        };

        xhr.onload = async () => {
            if (xhr.status === 200) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    await addDoc(collection(db, "posts"), {
                        uploaderName: currentUser.name,
                        uploaderInsta: currentUser.insta,
                        title: title,
                        type: type,
                        url: response.secure_url,
                        approved: false,
                        likes: 0,
                        comments: [],
                        createdAt: new Date()
                    });
                    alert("Post successfully submitted for admin approval!");
                    document.getElementById('uploadForm').reset();
                    closeModal('uploadModal');
                    loadUserPostStatuses();
                } catch (parseErr) {
                    alert("Upload succeeded, but database save failed.");
                }
            } else {
                try {
                    const errRes = JSON.parse(xhr.responseText);
                    alert(`Upload failed: ${errRes.error?.message || 'Unknown server error'}`);
                } catch (err) {
                    alert(`Media upload failed. Status: ${xhr.status}`);
                }
            }
            btn.disabled = false;
            progressContainer.style.display = 'none';
        };

        xhr.onerror = () => {
            alert("Network error during upload. Please check your internet connection.");
            btn.disabled = false;
            progressContainer.style.display = 'none';
        };

        xhr.send(formData);
    });

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1280;
                    const MAX_HEIGHT = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        resolve(new File([blob], file.name, {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        }));
                    }, 'image/jpeg', 0.8);
                };
            };
        });
    }

    async function loadUserPostStatuses() {
        if (!currentUser) return;
        const statusContainer = document.getElementById('myPostsStatusList');
        statusContainer.innerHTML = `<span style="font-size: 0.72rem; color: var(--text-muted);">Checking status...</span>`;

        try {
            const q = query(collection(db, "posts"), where("uploaderName", "==", currentUser.name), where("uploaderInsta", "==", currentUser.insta));
            const querySnapshot = await getDocs(q);
            
            statusContainer.innerHTML = "";
            if (querySnapshot.empty) {
                statusContainer.innerHTML = `<span style="font-size: 0.72rem; color: var(--text-muted);">No submissions found</span>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const isApproved = data.approved;
                statusContainer.innerHTML += `
                    <div class="status-item">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;" title="${data.title}">${data.title}</span>
                        <span class="status-badge ${isApproved ? 'approved' : 'pending'}">${isApproved ? 'Approved' : 'Pending'}</span>
                    </div>
                `;
            });
        } catch (err) {
            statusContainer.innerHTML = `<span style="font-size: 0.72rem; color: var(--accent-pink);">Failed to load status</span>`;
        }
    }

    async function loadGallery() {
        const container = document.getElementById('publicGallery');
        try {
            const q = query(collection(db, "posts"), where("approved", "==", true));
            const querySnapshot = await getDocs(q);
            container.innerHTML = "";

            if (querySnapshot.empty) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No approved posts found.</p>`;
                return;
            }

            const postsList = [];
            querySnapshot.forEach((docSnap) => {
                postsList.push({ id: docSnap.id, ...docSnap.data() });
            });

            postsList.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            postsList.forEach((data) => {
                const isOwner = window.isOwnerLoggedIn;
                const isAuthor = currentUser && currentUser.name === data.uploaderName && currentUser.insta === data.uploaderInsta;
                const canDeletePost = isOwner || isAuthor;

                let commentsHTML = "";
                (data.comments || []).forEach((c) => {
                    const canDeleteComment = isOwner || (currentUser && currentUser.name === c.name);
                    const commentJson = encodeURIComponent(JSON.stringify(c));
                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-text">
                                <strong>${c.name}</strong> <span>${c.text}</span>
                            </div>
                            ${canDeleteComment ? `<button class="btn-delete-comment" onclick="deleteComment('${data.id}', '${commentJson}')">✕</button>` : ''}
                        </div>
                    `;
                });

                const avatarChar = (data.uploaderName || 'U').charAt(0).toUpperCase();

                container.innerHTML += `
                    <div class="media-card">
                        <div class="post-header">
                            <div class="post-user-info">
                                <div class="post-user-avatar">${avatarChar}</div>
                                <div class="post-username">
                                    ${data.uploaderName} 
                                    <span style="display: block; font-size: 0.7rem; color: var(--primary-cyan);">${data.uploaderInsta || ''}</span>
                                </div>
                            </div>
                            ${canDeletePost ? `<button class="btn-delete-card" onclick="deletePost('${data.id}')">Delete</button>` : ''}
                        </div>
                        ${data.type === 'image' 
                            ? `<img src="${data.url}" alt="${data.title}" loading="lazy">` 
                            : `<video src="${data.url}" controls></video>`}
                        <div class="media-info">
                            <h4>${data.title}</h4>
                        </div>
                        <div class="ig-actions">
                            <button class="ig-action-btn" onclick="votePost('${data.id}', 'likes')">❤️ ${data.likes || 0}</button>
                        </div>
                        <div class="comments-section">
                            <div class="comments-list">${commentsHTML || '<p style="font-size: 0.75rem; color: var(--text-muted);">No comments yet.</p>'}</div>
                            <form class="comment-form" onsubmit="addComment(event, '${data.id}')">
                                <input type="text" placeholder="${currentUser ? 'Add a comment...' : 'Log in to comment'}" ${!currentUser ? 'disabled' : ''} required>
                                <button type="submit" ${!currentUser ? 'disabled' : ''}>Post</button>
                            </form>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            container.innerHTML = `<p style="color:var(--accent-pink);">Error loading gallery: ${err.message}</p>`;
        }
    }

    window.deletePost = async function(id, url) {
        if (confirm("Delete this post permanently?")) {
            await deleteDoc(doc(db, "posts", id));
            loadGallery();
            if (currentUser) loadUserPostStatuses();
        }
    };

    window.addComment = async function(e, postId) {
        e.preventDefault();
        if (!currentUser) {
            alert("Please log in to comment.");
            openModal('loginModal');
            return;
        }
        const input = e.target.querySelector('input');
        const commentObj = {
            name: currentUser.name,
            insta: currentUser.insta,
            text: input.value.trim(),
            id: Date.now().toString()
        };
        await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(commentObj) });
        loadGallery();
    };

    window.deleteComment = async function(postId, encodedComment) {
        const commentObj = JSON.parse(decodeURIComponent(encodedComment));
        if (confirm("Delete this comment?")) {
            await updateDoc(doc(db, "posts", postId), { comments: arrayRemove(commentObj) });
            loadGallery();
        }
    };

    window.votePost = async function(id, type) {
        await updateDoc(doc(db, "posts", id), { [type]: increment(1) });
        loadGallery();
    };

    window.loadPendingQueue = async function() {
        const container = document.getElementById('pendingQueue');
        const q = query(collection(db, "posts"), where("approved", "==", false));
        const querySnapshot = await getDocs(q);
        container.innerHTML = querySnapshot.empty ? "<p style='color:var(--text-muted);'>No pending submissions.</p>" : "";

        querySnapshot.forEach((documentSnap) => {
            const data = documentSnap.data();
            const id = documentSnap.id;
            container.innerHTML += `
                <div class="admin-item">
                    <img src="${data.type === 'video' ? 'https://via.placeholder.com/50?text=VIDEO' : data.url}" class="admin-preview">
                    <div>
                        <strong style="color:var(--text-main);">${data.title}</strong>
                        <p style="font-size:0.8rem;color:var(--primary-cyan);">By: ${data.uploaderName} (${data.uploaderInsta})</p>
                    </div>
                    <div class="admin-actions">
                        <button class="btn-approve" onclick="approvePost('${id}')">Approve</button>
                        <button class="btn-reject" onclick="rejectPost('${id}')">Reject</button>
                    </div>
                </div>
            `;
        });
    };

    window.approvePost = async function(id) {
        await updateDoc(doc(db, "posts", id), { approved: true });
        window.loadPendingQueue();
        loadGallery();
        if (currentUser) loadUserPostStatuses();
    };

    window.rejectPost = async function(id) {
        await deleteDoc(doc(db, "posts", id));
        window.loadPendingQueue();
        if (currentUser) loadUserPostStatuses();
    };

    loadGallery();
</script>
